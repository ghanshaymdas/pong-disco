<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="A classic single-player Pong game against a computer opponent.">
  <title>Pong — Player vs Computer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #100e18; color: #f4efe7; }
    main { width: min(100%, 960px); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin: 0 auto 12px; max-width: 900px; }
    h1 { font-size: clamp(1.15rem, 3vw, 1.65rem); margin: 0; letter-spacing: .04em; }
    .scoreboard { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.15rem; }
    .score { min-width: 2ch; text-align: center; font-size: 1.5rem; }
    .divider { color: #687386; }
    .game-frame { position: relative; border: 1px solid #4b4051; border-radius: 10px; overflow: hidden; box-shadow: 0 16px 48px #0008; }
    canvas { display: block; width: 100%; height: auto; background: #101522; }
    .help { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 18px; max-width: 900px; margin: 12px auto 0; color: #aab4c6; font-size: .9rem; }
    kbd { border: 1px solid #465168; border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: #f5f7fb; font: inherit; font-size: .82em; }
    @media (max-width: 560px) { body { padding: 16px 10px; } header { align-items: flex-start; flex-direction: column; } .help { font-size: .82rem; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>PONG <span style="color:#93a0b5">/ PLAYER VS COMPUTER</span></h1>
      <div class="scoreboard" aria-label="Score">
        <span>PLAYER</span><span class="score" id="playerScore">0</span>
        <span class="divider">:</span>
        <span class="score" id="computerScore">0</span><span>COMPUTER</span>
      </div>
    </header>
    <div class="game-frame">
      <canvas id="game" width="900" height="560" aria-label="Pong game. Move with W and S or the up and down arrow keys."></canvas>
    </div>
    <div class="help">
      <span>Move: <kbd>W</kbd>/<kbd>S</kbd> or <kbd>↑</kbd>/<kbd>↓</kbd></span>
      <span>First to 7 wins · <kbd>Space</kbd> pauses · <kbd>R</kbd> restarts</span>
    </div>
  </main>
  <script>
    (() => {
      "use strict";
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      const paddle = { w: 22, h: 104, speed: 430 };
      const player = { x: 34, y: (H - paddle.h) / 2 };
      const computer = { x: W - 34 - paddle.w, y: (H - paddle.h) / 2 };
      const BASE_BALL_SPEED = 360, MAX_BALL_SPEED = 620, WALL_SPEEDUP = 1.08;
      const ball = { x: W / 2, y: H / 2, r: 15, dx: BASE_BALL_SPEED, dy: 0, speed: BASE_BALL_SPEED };
      const bounceEffects = [];
      const keys = new Set();
      const scores = { player: 0, computer: 0 };
      const scoreEls = { player: document.getElementById("playerScore"), computer: document.getElementById("computerScore") };
      const WIN_SCORE = 7, AI_SPEED = 285, AI_DEAD_ZONE = 13, POINT_PAUSE = 0.72;
      let paused = false, finished = false, pointTimer = 0, lastTime = 0;

      function resetBall(towardPlayer) {
        ball.x = W / 2; ball.y = H / 2; ball.speed = BASE_BALL_SPEED;
        const angle = (Math.random() * 2 - 1) * 0.3;
        ball.dx = (towardPlayer ? -1 : 1) * ball.speed * Math.cos(angle);
        ball.dy = ball.speed * Math.sin(angle);
        bounceEffects.length = 0;
      }
      function clampPaddles() {
        player.y = Math.max(0, Math.min(H - paddle.h, player.y));
        computer.y = Math.max(0, Math.min(H - paddle.h, computer.y));
      }
      function score(who) {
        scores[who] += 1;
        scoreEls[who].textContent = String(scores[who]);
        finished = scores[who] >= WIN_SCORE;
        pointTimer = finished ? 0 : POINT_PAUSE;
        if (!finished) resetBall(who === "player");
      }
      // Circle-to-AABB overlap; only accept a paddle hit while the ball travels toward it.
      function hitsPaddle(p) {
        const nearestX = Math.max(p.x, Math.min(ball.x, p.x + paddle.w));
        const nearestY = Math.max(p.y, Math.min(ball.y, p.y + paddle.h));
        const ox = ball.x - nearestX, oy = ball.y - nearestY;
        return ox * ox + oy * oy <= ball.r * ball.r;
      }
      function bounceFrom(p, direction) {
        // Position-based angle bonus: center hits are flatter, edge hits are steeper.
        const impact = (ball.y - (p.y + paddle.h / 2)) / (paddle.h / 2);
        const angle = impact * (Math.PI / 3.2);
        // Keep the rally's current speed; it resets only when a point starts a new round.
        ball.dx = direction * ball.speed * Math.cos(angle);
        ball.dy = ball.speed * Math.sin(angle);
        ball.x = direction > 0 ? p.x + paddle.w + ball.r : p.x - ball.r;
        addBounceEffect(ball.x, ball.y, direction > 0 ? "#ff62dc" : "#60e9ff");
      }
      function addBounceEffect(x, y, color) {
        bounceEffects.push({ x, y, color, age: 0, duration: 0.28 });
      }
      function update(dt) {
        if (paused || finished) return;
        for (let i = bounceEffects.length - 1; i >= 0; i--) {
          bounceEffects[i].age += dt;
          if (bounceEffects[i].age >= bounceEffects[i].duration) bounceEffects.splice(i, 1);
        }
        if (pointTimer > 0) { pointTimer = Math.max(0, pointTimer - dt); return; }

        const move = (keys.has("ArrowUp") || keys.has("w") ? -1 : 0) + (keys.has("ArrowDown") || keys.has("s") ? 1 : 0);
        player.y += move * paddle.speed * dt;

        // The opponent reacts with a speed cap and a small dead zone, leaving room to outplay it.
        const targetY = ball.y - paddle.h / 2;
        const difference = targetY - computer.y;
        if (Math.abs(difference) > AI_DEAD_ZONE) {
          computer.y += Math.sign(difference) * Math.min(Math.abs(difference), AI_SPEED * dt);
        }
        clampPaddles();

        ball.x += ball.dx * dt;
        ball.y += ball.dy * dt;
        if (ball.y - ball.r < 0) {
          ball.y = ball.r; ball.dy = Math.abs(ball.dy);
          addBounceEffect(ball.x, ball.y, "#ff62dc");
          ball.speed = Math.min(ball.speed * WALL_SPEEDUP, MAX_BALL_SPEED);
          const scale = ball.speed / Math.hypot(ball.dx, ball.dy); ball.dx *= scale; ball.dy *= scale;
        } else if (ball.y + ball.r > H) {
          ball.y = H - ball.r; ball.dy = -Math.abs(ball.dy);
          addBounceEffect(ball.x, ball.y, "#60e9ff");
          ball.speed = Math.min(ball.speed * WALL_SPEEDUP, MAX_BALL_SPEED);
          const scale = ball.speed / Math.hypot(ball.dx, ball.dy); ball.dx *= scale; ball.dy *= scale;
        }

        if (ball.dx < 0 && hitsPaddle(player)) bounceFrom(player, 1);
        else if (ball.dx > 0 && hitsPaddle(computer)) bounceFrom(computer, -1);

        if (ball.x + ball.r < 0) score("computer");
        else if (ball.x - ball.r > W) score("player");
      }
      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath(); ctx.roundRect(x, y, width, height, radius);
      }
      function drawBackground(time) {
        ctx.fillStyle = "#121020"; ctx.fillRect(0, 0, W, H);
        // Slow colored beams and soft pools of light bring back the dance-floor feel.
        const sway = Math.sin(time / 1500) * 90;
        [[W * .12 + sway, 1, "#ff35c8"], [W * .88 - sway, -1, "#35dfff"], [W * .5 - sway * .35, 1, "#9d59ff"]].forEach(([x, dir, color], i) => {
          ctx.save(); ctx.globalAlpha = i === 2 ? .045 : .075; ctx.fillStyle = color;
          ctx.beginPath(); ctx.moveTo(x, -8); ctx.lineTo(x + dir * (170 + i * 35), H); ctx.lineTo(x - dir * 115, H); ctx.closePath(); ctx.fill(); ctx.restore();
        });
        for (const [x, y, radius, color] of [[W * .17, H * .08, 280, "#f321bf"], [W * .84, H * .2, 300, "#14b9ee"], [W * .52, H * .95, 250, "#813cf4"]]) {
          const pool = ctx.createRadialGradient(x, y, 4, x, y, radius);
          pool.addColorStop(0, color + "34"); pool.addColorStop(1, color + "00");
          ctx.fillStyle = pool; ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        }
        // A handful of dim mirrored flecks break up the dark field.
        ctx.save(); ctx.globalAlpha = .32;
        [[117,68],[772,104],[238,472],[681,399],[438,83],[548,512],[84,342],[826,276],[342,248],[610,180],[195,294],[739,488]].forEach(([x,y], i) => {
          ctx.fillStyle = i % 2 ? "#73eaff" : "#ff8ce5"; ctx.fillRect(x, y, 2, 2);
        });
        ctx.restore();
      }
      function drawPaddle(p, fill, edge) {
        ctx.save(); ctx.shadowColor = edge; ctx.shadowBlur = 20;
        roundedRect(p.x, p.y, paddle.w, paddle.h, 9);
        ctx.fillStyle = fill; ctx.fill();
        ctx.shadowBlur = 0; ctx.strokeStyle = "#ffffffbb"; ctx.lineWidth = 1;
        roundedRect(p.x + .5, p.y + .5, paddle.w - 1, paddle.h - 1, 8); ctx.stroke();
        ctx.restore();
      }
      function drawBall() {
        // Keep the ball easy to spot: a warm ivory surface, a small highlight, and a plain shadow.
        ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = "#05040a";
        ctx.beginPath(); ctx.ellipse(ball.x + 3, ball.y + 6, ball.r * 1.05, ball.r * .65, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        const sphere = ctx.createRadialGradient(ball.x - ball.r * .36, ball.y - ball.r * .4, 1, ball.x, ball.y, ball.r * 1.15);
        sphere.addColorStop(0, "#fffdf3"); sphere.addColorStop(.7, "#e5d9bd"); sphere.addColorStop(1, "#a99579");
        ctx.save(); ctx.shadowColor = "#f0dba8"; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fillStyle = sphere; ctx.fill();
        ctx.clip(); ctx.shadowBlur = 0;
        ctx.strokeStyle = "#9c876944"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(ball.x + 3, ball.y + 1, ball.r * .72, -.8, 1.35); ctx.stroke();
        ctx.fillStyle = "#ffffffaa"; ctx.beginPath(); ctx.arc(ball.x - 4, ball.y - 5, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      function draw(time) {
        drawBackground(time);
        ctx.save();
        ctx.shadowColor = "#c945ef"; ctx.shadowBlur = 10;
        ctx.strokeStyle = "#e78cff99"; ctx.lineWidth = 2; ctx.setLineDash([8, 15]);
        ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]);
        ctx.restore();
        drawPaddle(player, "#ff8be7", "#ff45cf");
        drawPaddle(computer, "#8cefff", "#3cbbe9");
        for (const effect of bounceEffects) {
          const progress = effect.age / effect.duration;
          ctx.save(); ctx.globalAlpha = 1 - progress; ctx.strokeStyle = effect.color;
          ctx.shadowColor = effect.color; ctx.shadowBlur = 16; ctx.lineWidth = 2.5 * (1 - progress) + .5;
          ctx.beginPath(); ctx.arc(effect.x, effect.y, ball.r + progress * 23, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
        drawBall();
        if (paused || finished) {
          ctx.fillStyle = "#080b12cc"; ctx.fillRect(0, 0, W, H);
          ctx.textAlign = "center"; ctx.fillStyle = "#ffffff";
          ctx.font = "700 34px system-ui, sans-serif";
          ctx.fillText(finished ? (scores.player > scores.computer ? "YOU WIN!" : "COMPUTER WINS") : "PAUSED", W / 2, H / 2 - 8);
          ctx.font = "16px system-ui, sans-serif"; ctx.fillStyle = "#bac4d4";
          ctx.fillText(finished ? "Press R to play again" : "Press Space to resume", W / 2, H / 2 + 28);
        }
      }
      function frame(time) {
        const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.033) : 0;
        lastTime = time; update(dt); draw(time); requestAnimationFrame(frame);
      }
      function restart() {
        scores.player = scores.computer = 0;
        scoreEls.player.textContent = scoreEls.computer.textContent = "0";
        player.y = computer.y = (H - paddle.h) / 2;
        paused = finished = false; pointTimer = 0; resetBall(Math.random() < 0.5);
      }
      window.addEventListener("keydown", (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (["ArrowUp", "ArrowDown", " "].includes(key)) event.preventDefault();
        if (key === " " && !finished) paused = !paused;
        if (key === "r") restart();
        if (["ArrowUp", "ArrowDown", "w", "s"].includes(key)) keys.add(key);
      });
      window.addEventListener("keyup", (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.delete(key);
      });
      window.addEventListener("blur", () => keys.clear());
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
